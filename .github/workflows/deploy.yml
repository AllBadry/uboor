name: Deploy Uboor to GitHub Pages

on:
  push:
    branches:
      - main # الروبوت سيعمل فقط عند رفع كود جديد على هذا الفرع

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # إعطاء صلاحية للروبوت للكتابة ورفع الملفات

    steps:
      - name: Checkout Code 🛎️
        uses: actions/checkout@v4

      - name: Setup Node.js ⚙️
        uses: actions/setup-node@v4
        with:
          node-version: "20" # نستخدم أحدث نسخة مستقرة من بيئة نود

      - name: Install Dependencies 📦
        run: npm install

      - name: Build Project 🏗️
        run: |
          npm run build

          # 🌟 خدعة الـ SPA الأساسية لـ GitHub Pages
          # هذا السطر يعوض حذف ملف 404 القديم، ويجعل غيت هاب يوجه أي مسار خاطئ للـ React
          cp dist/index.html dist/404.html

          # 🌟 خدعة الـ SEO: إنشاء مجلدات حقيقية تتطابق تماماً مع App.jsx
          # لاحظ إضافة المجلدات الفرعية داخل products
          mkdir -p dist/about dist/services dist/contact dist/products dist/products/wacollector dist/products/auto-capture dist/products/seo-monster dist/products/uwps dist/products/urm dist/privacy

          # نسخ الملف للمجلدات الجديدة
          cp dist/index.html dist/about/index.html
          cp dist/index.html dist/services/index.html
          cp dist/index.html dist/contact/index.html
          cp dist/index.html dist/products/index.html
          cp dist/index.html dist/products/wacollector/index.html
          cp dist/index.html dist/products/auto-capture/index.html
          cp dist/index.html dist/products/seo-monster/index.html
          cp dist/index.html dist/products/uwps/index.html
          cp dist/index.html dist/products/urm/index.html
          cp dist/index.html dist/privacy/index.html

      - name: Deploy to GitHub Pages 🚀
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # المجلد الذي يتم توليده بعد البناء في Vite
          cname: uboor.org
